<!DOCTYPE html>
<html lang="pt-br" dir="ltr">

<head>
    {% block head %}
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>
    <title>{% block title %}{% endblock %}</title>
    {% endblock %}

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        button {
            outline: none !important;
            box-shadow: none !important;
        }

        button:focus {
            outline: none !important;
        }
    </style>

</head>

<body>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top"
        style="background-color: #105670; box-shadow: 0 3px 4px 0 rgba(0,0,0,.2);">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{url_for('home')}}">
                <img src="../static/devias_logo.png" alt="" width="50">
            </a>

            <div class="collapse navbar-collapse justify-content-start ps-2" id="navbarNavAltMarkup">
                <ul class="navbar-nav justify-content-start">
                    <li><a class="nav-link active ps-2" aria-current="page" style="font-size: 18px;"
                            href="{{url_for('home')}}">Início</a></li>
                    <li><a class="nav-link active ps-2" style="font-size: 18px;" href="#">Planos </a></li>
                    <li><a class="nav-link active ps-2" style="font-size: 18px;" href="#">Pontuação</a></li>
                </ul>
            </div>

            <div class="pe-4 ms-auto">
                <a href="https://google.com" class="btn btn-outline-light btn-lg" role="button">Analisar Código</a>
            </div>

            <div class="dropdown">
                <button class="btn dropdown-toggle ms-auto" type="button" id="dropdownMenuButton1"
                    data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" style="color: white;">

                    {{username}} &nbsp; <img src="../static/devias_logo.png" alt="" width="40">

                </button>

                <ul class="dropdown-menu dropdown-menu-lg-end" aria-labelledby="dropdownMenuButton1">
                    <li><a class="dropdown-item" href="#">Meu Perfil</a></li>
                    <li><a class="dropdown-item" href="#">Meus Projetos</a></li>
                    <li><a class="dropdown-item" href="#">Configurações</a></li>
                    <hr>
                    <li><a class="dropdown-item" href="#">Sair</a></li>
                </ul>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="d-flex flex-column min-vh-100" style="width: 100%;">

        <div class="d-flex flex-column flex-grow-1" id="content" style="background-color: ghostwhite;">
            {% block content %}
            {% endblock %}
        </div>



        <footer class="row mt-auto" style="background-color: white; color: black;">

            <hr class="mb-3"
                style="width: 100%; height: 2px; color:#105670; opacity: 1; box-shadow: 0 -3px 4px 0 rgba(0,0,0,.2);">

            <div class="row">
                <div class="col-9">
                    <div class="d-flex flex-row justify-content-center align-items-center">
                        <div class="p-3 mt-4">
                            <img src="../static/rnp_logo.png" alt="" width="100">
                        </div>

                        <div class="p-3 mt-4">
                            <img src="../static/ita-logo-6.png" alt="" width="90">
                        </div>

                        <div class="p-3 mt-4">
                            <img src="../static/eb_logo.png" alt="" width="50">
                        </div>
                        <div class="p-3 mt-4">
                            <img src="../static/ifto_logo.png" alt="" width="60">
                        </div>
                    </div>
                </div>

                <div class="col-3">
                    <div class="d-flex justify-content-end pt-4 pb-2">
                        <div class="container">
                            <p><strong>Contato</strong> </p>
                            <p style="font-size: 12px;">
                                Rua X <br>
                                Cidade Y <br>
                                Telefone Z <br>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <hr class="mb-3" style="width: 80%; margin: auto; color: #105670;">
            <p class="text-center">&copy; 2022 Company, Inc</p>
        </footer>
    </div>


</body>

</html>
