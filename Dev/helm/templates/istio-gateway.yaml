apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: {{ include "helm.fullname" . }}-gateway
  labels:
    {{- include "helm.labels" . | nindent 4 }}
spec:
  servers:
    - port:
        number: 80
        protocol: HTTP
        name: http
      hosts:
        - {{ .Values.host }}
  selector:
    istio: ingressgateway