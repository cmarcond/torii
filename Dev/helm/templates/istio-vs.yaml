apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "helm.fullname" . }}-virtualservice
  labels:
    {{- include "helm.labels" . | nindent 4 }}
spec:
  hosts:
  - {{ .Values.host }}
  gateways:
  - {{ include "helm.fullname" . }}-gateway
  http:
  - route:
      - destination:
          host: {{ include "helm.fullname" . }}
          port:
            number: 5000