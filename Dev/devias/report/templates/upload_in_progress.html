{% extends "base.html" %}


{% block head %}
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $(document).ready(function () {
        var refresh_id = setInterval(function () {
            $.get(
                "{{ url_for('submit.get_job_status', project_uuid = project_uuid) }}",
                function (data) {
                    console.log(data);
                    if (data == "running") {
                        window.location.replace("{{ url_for('report.get', project_name=project_name) }}");
                    }
                    else if (data == "upload import error") {
                        window.location = window.location;
                        document.getElementById("upload_errors").innerHTML = "<p>Ocorreu um erro na importação. Por favor tente novamente mais tarde.</p>";
                    }
                    else if (data == "invalid upload language") {
                        window.location = window.location;
                        document.getElementById("upload_errors").innerHTML = "<p>Linguagem de projeto inválida. Atualmente são analisados apenas projetos em Python ou em Java.</p>";
                    }
                }
            )
        }
            , 3000);
    });
</script>
{% endblock %}


{% block title %}
Importando projeto
{% endblock %}


{% block content %}
<div class="container p-4" style="margin-top: 100px;" id="content">

    <h3>Seu projeto está sendo importado. Por favor aguarde.</h3>
    <!-- <p>{{session[project_uuid]}}</p> -->

</div>


{% endblock %}
